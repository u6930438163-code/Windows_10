name: Agent Bridge unit tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m compileall -q agents tests
      - name: Run local bridge tests
        run: python -m unittest discover -s tests -v
