name: PowerShell parse check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $errorsFound = $false
          Get-ChildItem -Path scripts,ui -Filter '*.ps1' -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.ToString() }
              $errorsFound = $true
            }
          }
          if ($errorsFound) { exit 1 }
          Write-Host 'Skrypty PowerShell poprawne skladniowo.'
      - name: Validate touch XAML markup
        shell: powershell
        run: |
          $source = Get-Content -Path ui/TouchShell.ps1 -Raw
          $start = "[xml]" + '$layout' + " = @'"
          $startIndex = $source.IndexOf($start)
          if ($startIndex -lt 0) { throw 'Nie znaleziono bloku XAML' }
          $xmlStart = $startIndex + $start.Length
          $endIndex = $source.IndexOf("'@", $xmlStart)
          if ($endIndex -le $xmlStart) { throw 'Niedomkniety blok XAML' }
          $content = $source.Substring($xmlStart, $endIndex - $xmlStart)
          [xml]$markup = $content
          if ($markup.DocumentElement.LocalName -ne 'Window') {
            throw 'Niepoprawny element glowny interfejsu'
          }
          Write-Host 'Pulpit dotykowy ma poprawna skladnie XML.'
